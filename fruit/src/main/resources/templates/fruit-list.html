<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fruit List</title>
</head>
<body>
    <h1>Fruits</h1>
    <a href="/fruits/new">Add New Fruit</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fruit : ${fruits}">
                <td th:text="${fruit.id}"></td>
                <td th:text="${fruit.name}"></td>
                <td>
                    <a th:href="@{/fruits/edit/{id}(id=${fruit.id})}">Edit</a> |
                    <a th:href="@{/fruits/delete/{id}(id=${fruit.id})}">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
